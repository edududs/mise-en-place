[project]
name = "mise-en-place"
version = "0.1.0"
description = "Curso de engenharia de software em Python pela analogia de uma cozinha — e o simulador/jogo que ele constrói"
readme = "README.md"
requires-python = ">=3.13"
# Aulas 1-5 são stdlib. Pydantic entra na aula 8 para validar arquivos de entrada.
dependencies = [
    "pydantic>=2.12,<3",
]

[dependency-groups]
dev = [
    "hypothesis>=6.140.3",
    "mypy>=1.19.0",
    "pyright>=1.1.409",
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.22",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mise_en_place"]
